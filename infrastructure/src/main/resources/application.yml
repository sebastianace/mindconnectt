spring:
  application:
    name: mindconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

queue:
  block-users:
    fixed-delay-ms: ${QUEUE_BLOCK_USERS_FIXED_DELAY_MS:5000}

security:
  jwt:
    # Clave HMAC en Base64 (mínimo 256 bits). Sin valor por defecto: la app NO arranca sin JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  bootstrap-admin:
    # Opcional: si ambos tienen valor, se crea el primer administrador al arrancar.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
